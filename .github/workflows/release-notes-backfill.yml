name: Backfill release notes

# 一次性/按需任务：把 CHANGELOG.md 里各版本段落写进对应 GitHub Release 正文。
# 用于历史版本（v1.0.0 ~ v2.1.0）发布时还没有接入 body_path 的情况。
# 之后的新版本由 release.yml 自动提取，无需再跑本任务。

on:
  # CHANGELOG 更新时自动同步各版本 Release 正文（以 CHANGELOG 为准）
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      tag:
        description: "只回填某个 tag（例如 v2.1.0）；留空则处理 CHANGELOG 里的全部版本"
        required: false
        type: string
      dry_run:
        description: "只打印将要写入的内容，不实际修改 Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync CHANGELOG sections into Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          versions=$(grep -oP '^## v\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sort -u -V)
          echo "CHANGELOG 中的版本："; echo "$versions"
          for v in $versions; do
            tag="v$v"
            if [ -n "${ONLY_TAG:-}" ] && [ "$tag" != "$ONLY_TAG" ]; then
              continue
            fi
            if ! gh release view "$tag" > /dev/null 2>&1; then
              echo "::warning::跳过 $tag（Release 不存在）"
              continue
            fi
            awk -v header="## v$v " '
              index($0, header) == 1 { f = 1; next }
              f && /^## / { exit }
              f { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "::warning::跳过 $tag（CHANGELOG 段落为空）"
              continue
            fi
            echo "----- $tag -----"
            cat notes.md
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[dry-run] 不修改 $tag"
              continue
            fi
            gh release edit "$tag" --notes-file notes.md
            echo "已回填 $tag"
          done
