name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 执行书 M6-05：keystore 以 base64 存在 Secrets，CI 临时还原，用完即弃
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIAOYU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.XIAOYU_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.XIAOYU_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          missing=""
          if [ -z "${KEYSTORE_BASE64:-}" ]; then missing="$missing XIAOYU_KEYSTORE_BASE64"; fi
          if [ -z "${STORE_PASSWORD:-}" ]; then missing="$missing XIAOYU_KEYSTORE_PASSWORD"; fi
          if [ -z "${KEY_PASSWORD:-}" ]; then missing="$missing XIAOYU_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "以下 Secrets 为空或未配置：$missing" >&2
            exit 1
          fi
          # 别名不是敏感信息，固定为 xiaoyu（见 docs/SETUP.md）
          alias="xiaoyu"
          mkdir -p keys
          # 去掉粘贴时可能带上的换行、空格与引号，并按 URL-safe 兼容处理
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t "' | tr -d "'" | tr '_-' '/+')
          len=${#clean}
          printf 'XIAOYU_KEYSTORE_BASE64 清洗后：长度=%s mod4=%s 指纹=%s\n' \
            "$len" "$((len % 4))" "$(printf '%s' "$clean" | sha256sum | cut -d' ' -f1)"
          if ! printf '%s' "$clean" | base64 -d > keys/xiaoyu-release.jks 2>/dev/null; then
            echo "base64 解码失败。预期的正确值是：长度 3660、mod4=0、指纹 5447df397700a88289381851445de02e7998980df7d3b2bdf4d8d7b38f657768" >&2
            exit 1
          fi
          size=$(wc -c < keys/xiaoyu-release.jks)
          echo "keystore 已还原：${size} 字节，sha256=$(sha256sum keys/xiaoyu-release.jks | cut -d' ' -f1)"
          if [ "$size" -lt 1000 ]; then
            echo "还原后的 keystore 过小，Secrets.XIAOYU_KEYSTORE_BASE64 可能被截断" >&2
            exit 1
          fi
          # 先只用 store 口令打开 keystore，能区分「口令错」与「别名错」
          if ! keytool -list -keystore keys/xiaoyu-release.jks -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "keystore 文件正确，但 XIAOYU_KEYSTORE_PASSWORD 打不开它：请从 key.properties 的 storePassword 精确复制（共 28 位，无空格）" >&2
            exit 1
          fi
          if ! keytool -list -keystore keys/xiaoyu-release.jks -storepass "$STORE_PASSWORD" -alias "$alias" > /dev/null 2>&1; then
            echo "store 口令正确，但别名 $alias 不存在于该 keystore 中" >&2
            exit 1
          fi
          {
            echo "storeFile=keys/xiaoyu-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$alias"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Unit tests + coverage gate
        run: ./gradlew :soul:check --no-daemon --console=plain

      # 执行书 M6-04：tag 触发 per-ABI 构建，签名后产出 app-v<版本>-<abi>.apk
      - name: Build signed APKs
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PxiaoyuVersionName="$VERSION" \
            -PxiaoyuVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Rename APKs and generate checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          rm -f output-metadata.json
          shopt -s nullglob
          for f in app-*-release.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "app-v${VERSION}-${abi}.apk"
          done
          if [ -f app-release.apk ]; then
            mv app-release.apk "app-v${VERSION}-universal.apk"
          fi
          sha256sum ./*.apk > "app-v${VERSION}-SHA256SUMS.txt"
          cat "app-v${VERSION}-SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-v${{ env.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "小鱼 v${{ env.VERSION }}"
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 执行书 M6-04：发布后把版本条目写回 CHANGELOG（失败不影响发布）
      - name: Prepend CHANGELOG entry
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 已在版本发布前手写好同版本条目时跳过，避免重复插入标题
          if grep -q "^## v${version} " CHANGELOG.md; then
            echo "CHANGELOG 已存在 v${version} 条目，跳过自动插入"
            exit 0
          fi
          date_utc="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          {
            echo "# 更新日志"
            echo
            echo "## v${version} (${date_utc})"
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo
            tail -n +2 CHANGELOG.md
          } > "$tmp"
          mv "$tmp" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): v${version}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
